# /etc/nginx/sites-available/agrik.co.conf — as deployed on 72.62.185.212.
# Bootstrapped without the SSL directives, then rewritten in place by
# `certbot --nginx` (see deploy/DEPLOY.md) to add the listen 443 ssl /
# ssl_certificate lines and the redirect blocks below.
server {
    server_name agrik.co www.agrik.co;

    root /var/www/agrik/web/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agrik.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agrik.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name api.agrik.co;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agrik.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agrik.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.agrik.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = agrik.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name agrik.co www.agrik.co;
    return 404; # managed by Certbot




}

server {
    if ($host = api.agrik.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.agrik.co;
    return 404; # managed by Certbot


}