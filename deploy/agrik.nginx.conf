# /etc/nginx/sites-available/agrik.co.conf
# Static frontend (Vite build) at agrik.co / www.agrik.co
server {
    server_name agrik.co www.agrik.co;

    root /var/www/agrik/web/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must never be cached — it's how PWA updates propagate.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/agrik.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrik.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Backend API at api.agrik.co -> Node/Express on 127.0.0.1:8000
server {
    server_name api.agrik.co;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.agrik.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agrik.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS redirects
server {
    listen 80;
    server_name agrik.co www.agrik.co;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name api.agrik.co;
    return 301 https://$host$request_uri;
}
